# ============================================================
#  BOŞ ŞABLON — tüm seçenekler. Kullanmadığın satırları silebilirsin.
#  Çok dilli metin:  {tr: "Merhaba", en: "Hello", pl: "Cześć"}
#  ya da tek dil:    "Merhaba"
# ============================================================
ad: projem
diller: [tr, en]
format: dikey            # dikey | yatay | kare
fps: 30                  # sahnelerde "poz: 12" (el yapımı his) kullanılıyorsa 24 yap
kalite: 2                # 1 = hızlı, 2 = keskin

tema:                    # renkler (hepsi isteğe bağlı)
  vurgu: "#f2b64a"       # rota, sayaç vb.
  deniz: "#10203a"
  kara: "#2c4060"
  sinir: "#50709a"
  nokta: "#e85c48"
  altyazi_y: 0.86
  altyazi_boyut: 40

# muzik: {dosya: muzik/arka.mp3, ses: 0.15}

sahneler:

  # ------------------------------------------------ HARİTA
  - tur: harita
    sure: 6                          # saniye (seslendirme daha uzunsa otomatik uzar)
    # ses: {tr: ses/tr/01.wav}
    giris: siyah                     # siyah | beyaz | yok
    izgara: true                     # enlem/boylam çizgileri
    kamera:                          # bir veya daha fazla durak; aradaki hareket otomatik
      - {t: 0, merkez: [30, 38], genislik: 30}    # [boylam, enlem], genislik = görünen derece
      - {t: 4, merkez: [29, 41], genislik: 8}
    cikis: {tur: zoom, hedef: [28.98, 41.01], sure: 1.0}   # ya da: siyah | beyaz | yok
    vurgula:                         # ülkeyi boyar (İngilizce adı: Turkey, Poland, Egypt...)
      - {ad: Turkey, bas: 1.0, renk: "#f2b64a"}
    ulke_adlari: [Turkey, Greece]    # ülke adlarını seçilen dilde otomatik yazar
    etiketler:                       # deniz/bölge adları
      - {metin: {tr: Karadeniz, en: Black Sea}, konum: [34, 43.2], boyut: 28, bas: 1}
    rotalar:
      - {noktalar: [[32.85, 39.93], [30.5, 40.5], [28.98, 41.01]], bas: 1.5, sure: 2.5, kalinlik: 8}
    noktalar:
      - {konum: [28.98, 41.01], etiket: İstanbul, etiket_yonu: sag, nabiz: true, bas: 4}   # etiket_yonu: sag|sol|ust|alt
    yazilar:
      - {metin: {tr: "BAŞLIK", en: "TITLE"}, y: 0.1, boyut: 64, bit: 2.5}
      - {sayac: [1400, 1453], bas: 1.5, sayac_suresi: 2.5, x: 0.8, y: 0.6, boyut: 70, kutu: "#000000"}
    altyazi: {tr: "Ekranın altında kutulu yazı", en: "Boxed text at the bottom"}

  # ------------------------------------------------ RESİM (katmanlı)
  - tur: resim
    sure: 6
    kamera: {zoom: [1.0, 1.12], kay: [[0.02, 0], [-0.02, 0]]}   # başlangıç → bitiş
    katmanlar:                       # alttan üste doğru
      - {dosya: resimler/arka.png, derinlik: 0.1}
      - {dosya: resimler/on_plan.png, derinlik: 0.8}                  # şeffaf PNG
      - {dosya: resimler/karakter.png, mod: nesne, x: 0.5, y: 0.7, yukseklik: 0.35, derinlik: 1.0, bas: 0.5, salinim: 6}
    parcacik: toz                    # toz | kar
    vinyet: 0.5                      # kenar karartma gücü (0-1)
    yazilar:
      - {metin: "1453", y: 0.15, boyut: 160, animasyon: buyume, bas: 0.8}

  # ------------------------------------------------ KART
  - tur: kart
    sure: 5
    arka_plan: ["#141c2e", "#3a2230"]    # tek renk de olur: "#101010"
    yazilar:
      - {metin: {tr: "Alıntı ya da kapanış yazısı"}, y: 0.5, boyut: 56, font: serif-kalin, animasyon: yazma, yazma_hizi: 30}

# ------------------------------------------------ YAZI SEÇENEKLERİ (her sahnede)
#  metin, x, y (0-1), boyut, renk, genislik (0-1, satır kaydırma)
#  font: kalin | normal | serif | serif-kalin
#  hiza: orta | sol | sag
#  bas, bit: saniye (sahne içinde)
#  animasyon: yukari | solma | buyume | yazma | yok
#  kutu: "#000000" (arka kutu), kutu_saydamlik: 0.6, golge: true/false
#  sayac: [baslangic, bitis], sayac_suresi

# ============================================================
#  ÇİZGİ FİLM SAHNESİ (karakter animasyonu)
# ============================================================
#  - tur: cizgi
#    sure: 4
#    arka_plan: ["#0d1430", "#1d2452"]      # renk geçişi, tek renk ya da resim (cizgi/arka.png)
#    kamera:                                 # zoom + merkez; aradaki hareket otomatik
#      - {t: 0, zoom: 1, merkez: [0.5, 0.5]}
#      - {t: 4, zoom: 1.3, merkez: [0.4, 0.6]}
#    ogeler:                                 # alttan üste çizilir
#      - dosya: cizgi/karakter.png
#        kirp: cizgi/karakter_kirp.png       # gözleri kapalı hali -> otomatik göz kırpma
#        x: 0.5
#        y: 0.6
#        boyut: 0.3                          # ekran yüksekliğine oran
#        bas: 0.5                            # sahnede belireceği saniye
#        giris: zipla                        # zipla | solma | buyu | kay_sol | kay_sag | kay_ust | kay_alt | yok
#        bekleme: "nefes salla"              # nefes salla zipla titre nabiz don suz (birden fazla olur) | yok
#        yol: [[0, 0.5, 0.6], [2, 0.8, 0.4]] # [saniye, x, y] -> bu noktalardan geçerek hareket eder
#        aci: 0                              # döndürme (derece); donme: [[0, 0], [2, 90]] ile animasyon
#        ayna: false                         # yatay çevir
#        capa: alt                           # y değeri resmin altını gösterir (yerde duran karakterler için)
#        saydamlik: 1.0
#        cikis: {t: 3, tur: kucul, sure: 0.4, ses: parilti}   # kucul | solma | kay_sol | kay_sag ...
#        ses: pop                            # belirdiği anda çalan efekt
#    efektler:                               # zamanlı ses efektleri
#      - {t: 1.0, ses: vin, seviye: 0.6}
#
#  Hazır ses efektleri (motor/sesler): pop, vin, parilti, bum, tik, lazer
#  Hazır müzik: muzik: {dosya: ortam_muzik.mp3, ses: 0.35}
#  Yazı animasyonları ayrıca: kelime (kelime kelime belirir), zipla (zıplayarak gelir)

# ============================================================
#  VEKTÖR SAHNESİ (en kaliteli tür — tarayıcıda SVG ile çizilir)
# ============================================================
#  - tur: vektor
#    baslik: Kanca                     # stüdyodaki sahne listesinde görünen ad
#    dosya: sahneler/01_kanca.html     # sahnenin çizim dosyası (Claude hazırlar)
#    sure: 5.5
#    anlatim: {tr: "...", en: "..."}   # seslendirme metni (stüdyoda kopyalanır / Chatterbox okur)
#    storyboard:                       # 🎬 Storyboard penceresinde görünen notlar
#      ekranda: "Ortada büyük sarı 3, altında ahtapot"
#      hareket: "3 sayarak gelir, kamera yavaşça yaklaşır"
#      gecis: "3 büyüyüp ekranı kaplar, sahne 2'nin rengine dönüşür"
#    efektler:
#      - {t: 1.3, ses: pop}
#
#  Sahne geçişleri sahne dosyasında ayarlanır: cikis: "devir" (bir nesne büyüyüp sonraki sahneye
#  dönüşür) ve sonraki sahnede giris: "devir". Ayrıntılar ve kurallar: CLAUDE.md
#
#  Vektör sahneleri stüdyoda video üretmeden canlı oynatılır.
#  Videoya kaydederken bilgisayardaki Edge (yoksa Chrome) kullanılır.
#  Metinler sahne dosyasının içinde {tr: ..., en: ..., pl: ...} olarak durur.
