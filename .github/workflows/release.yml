# Builds the installers and publishes a GitHub release whenever the version in .surum changes.
# Raise the number in .surum, add a note to changelog.json, push to main: the rest is automatic.
name: Release

on:
  push:
    branches: [main]
    paths: [".surum", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          SURUM="$(tr -d '[:space:]' < .surum)"
          echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          if gh release view "v$SURUM" >/dev/null 2>&1; then echo "var=1" >> "$GITHUB_OUTPUT"; else echo "var=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install build tools
        if: steps.v.outputs.var == '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip unzip

      - name: Build installers
        if: steps.v.outputs.var == '0'
        run: bash packaging/build.sh

      - name: Write release notes
        if: steps.v.outputs.var == '0'
        run: |
          python3 - "${{ steps.v.outputs.surum }}" > notlar.md <<'PY'
          import json, sys
          surum = sys.argv[1]
          for n in json.load(open("changelog.json", encoding="utf-8")):
              if n.get("surum") == surum:
                  print("\n".join("- " + x for x in n.get("en", [])))
                  break
          print()
          print("**Install:** Windows: run `Animation-Studio-Setup-%s-x64.exe`. "
                "Mac (Apple silicon and Intel): unzip, move *Animation Studio* to Applications, "
                "if macOS blocks the first start, open System Settings → Privacy & Security and choose Open Anyway." % surum)
          print()
          print("Already installed 1.2.0 or later? The studio updates itself; you don't need these files.")
          PY

      - name: Publish release
        if: steps.v.outputs.var == '0'
        run: |
          gh release create "v${{ steps.v.outputs.surum }}" packaging/dist/* \
            --title "Animation Studio ${{ steps.v.outputs.surum }}" --notes-file notlar.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
